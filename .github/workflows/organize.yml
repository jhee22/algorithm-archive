name: Organize coding study
on:
  push:
    branches: [main]
    paths:
      - 'solutions/**'
      - '프로그래머스/**'
      - '백준/**'
      - 'SWEA/**'
      - 'trail*/**'
      - 'scripts/**'
      - '.github/workflows/organize.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coding-study-organize
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/organize_uploads.py
      - name: Commit organized uploads and index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: organize solutions and refresh index'
            git push origin HEAD:main
          fi
